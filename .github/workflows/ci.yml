name: Grain Guardian CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate AI Model Routines
      run: |
        python ai-model/test_predict.py

    - name: Initialize SQLite Database
      run: |
        python backend/init_db.py

    - name: Run Auth & Missing Table Regression Tests
      run: |
        python backend/test_auth_regression.py

    - name: Run Backend Integration & API Tests
      run: |
        python backend/app.py &
        sleep 3
        python backend/test_api.py
